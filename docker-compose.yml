services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:?Set SQL_SA_PASSWORD in .env}
    ports:
      - "1433:1433"
    volumes:
      - raceday-sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\""]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  api:
    build:
      context: ./Part2-API
      dockerfile: src/RaceDay.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Database__Provider: SqlServer
      ConnectionStrings__DefaultConnection: Server=sqlserver,1433;Database=RaceDayApiDB;User Id=sa;Password=${SQL_SA_PASSWORD:?Set SQL_SA_PASSWORD in .env};TrustServerCertificate=True;Encrypt=False
      Database__ApplyMigrationsOnStartup: "true"
      Database__MigrationRetryCount: "20"
      Database__MigrationRetryDelaySeconds: "5"
      Registration__OrganiserCode: ${RACEDAY_ORGANISER_CODE:?Set RACEDAY_ORGANISER_CODE in .env}
      AzureBlobStorage__ConnectionString: ${AZURE_BLOB_STORAGE_CONNECTION_STRING:-}
      AzureBlobStorage__ContainerName: ${AZURE_BLOB_STORAGE_CONTAINER:-raceday-images}
    ports:
      - "5080:8080"
    depends_on:
      sqlserver:
        condition: service_healthy

  web:
    build:
      context: ./Part2-API
      dockerfile: src/RaceDay.Web/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Api__BaseUrl: http://api:8080/
    ports:
      - "5280:8080"
    depends_on:
      - api

volumes:
  raceday-sql-data:
